name: Validation

on:
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: web/.cache
          key: pmdco-${{ runner.os }}-${{ hashFiles('web/scripts/fetch-pmdco.mjs') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fetch-pmdco
      - run: npm run test:pmdco
      - run: npm run build

  python-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -m "not reasoner and not pmdco"

  python-reasoner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERMANTICS_CACHE: ${{ github.workspace }}/.cache/mermantics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: .cache/mermantics
          key: robot-${{ runner.os }}-${{ hashFiles('src/mermantics/robot.py') }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -m "reasoner and not pmdco" --require-reasoner
